<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gemini AI Studio</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen font-sans">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center">
    <h1 class="text-lg font-bold text-blue-400">✨ AI Studio Mobile</h1>
    <button onclick="toggleSettings()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">
      ⚙️ Settings
    </button>
  </header>

  <!-- Settings Modal -->
  <div id="settings-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 w-full max-w-sm space-y-4">
      <h2 class="text-base font-bold text-white">Model Parameters</h2>
      
      <div>
        <label class="text-xs text-slate-400">Gemini API Key</label>
        <input id="api-key" type="password" placeholder="AIzaSy..." class="w-full mt-1 bg-slate-950 border border-slate-800 rounded p-2 text-sm focus:outline-blue-500" />
      </div>

      <div>
        <label class="text-xs text-slate-400">Model</label>
        <select id="model-select" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded p-2 text-sm">
          <option value="gemini-2.5-flash">gemini-2.5-flash</option>
          <option value="gemini-2.5-pro">gemini-2.5-pro</option>
          <option value="gemini-2.0-flash">gemini-2.0-flash</option>
        </select>
      </div>

      <div>
        <label class="text-xs text-slate-400">System Instruction</label>
        <textarea id="sys-instruction" placeholder="You are an expert AI..." class="w-full mt-1 bg-slate-950 border border-slate-800 rounded p-2 text-xs h-16"></textarea>
      </div>

      <div>
        <div class="flex justify-between text-xs text-slate-400">
          <span>Temperature</span>
          <span id="temp-val">1.0</span>
        </div>
        <input id="temperature" type="range" min="0" max="2" step="0.1" value="1.0" class="w-full" oninput="document.getElementById('temp-val').innerText = this.value" />
      </div>

      <button onclick="saveSettings()" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded-lg font-medium text-sm text-white">Save & Close</button>
    </div>
  </div>

  <!-- Chat / Prompt Area -->
  <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3">
    <div class="bg-slate-900/60 border border-slate-800/80 p-3 rounded-lg text-sm text-slate-300">
      Welcome to AI Studio. Tap <b>Settings</b> at the top right to paste your Gemini API key and adjust parameters.
    </div>
  </main>

  <!-- Image Preview Badge -->
  <div id="image-preview-container" class="hidden px-4 py-1 bg-slate-900 flex items-center gap-2">
    <span class="text-xs text-blue-400">Image attached</span>
    <button onclick="clearImage()" class="text-xs text-red-400">Remove</button>
  </div>

  <!-- Bottom Input Bar -->
  <footer class="p-3 bg-slate-900 border-t border-slate-800 flex items-center gap-2">
    <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg border border-slate-700 text-sm">
      📷
      <input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleImage(this)" />
    </label>
    <input id="prompt-input" type="text" placeholder="Type a prompt..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" onkeydown="if(event.key==='Enter') sendPrompt()" />
    <button onclick="sendPrompt()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-medium text-sm">Send</button>
  </footer>

  <script>
    let base64Image = null;
    let base64Mime = "";

    // Load stored key
    document.getElementById("api-key").value = localStorage.getItem("gemini_key") || "";
    document.getElementById("sys-instruction").value = localStorage.getItem("gemini_sys") || "";

    function toggleSettings() {
      document.getElementById("settings-modal").classList.toggle("hidden");
    }

    function saveSettings() {
      localStorage.setItem("gemini_key", document.getElementById("api-key").value);
      localStorage.setItem("gemini_sys", document.getElementById("sys-instruction").value);
      toggleSettings();
    }

    function handleImage(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        base64Mime = file.type;
        const reader = new FileReader();
        reader.onload = (e) => {
          base64Image = e.target.result.split(",")[1];
          document.getElementById("image-preview-container").classList.remove("hidden");
        };
        reader.readAsDataURL(file);
      }
    }

    function clearImage() {
      base64Image = null;
      document.getElementById("image-input").value = "";
      document.getElementById("image-preview-container").classList.add("hidden");
    }

    function appendMessage(role, text) {
      const box = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = role === "user" 
        ? "bg-blue-600/20 border border-blue-500/30 text-blue-100 p-3 rounded-lg ml-auto max-w-[85%] text-sm" 
        : "bg-slate-900 border border-slate-800 text-slate-200 p-3 rounded-lg mr-auto max-w-[85%] text-sm whitespace-pre-wrap";
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    async function sendPrompt() {
      const input = document.getElementById("prompt-input");
      const prompt = input.value.trim();
      const apiKey = localStorage.getItem("gemini_key") || document.getElementById("api-key").value;
      const model = document.getElementById("model-select").value;
      const temp = parseFloat(document.getElementById("temperature").value);
      const systemInstruction = localStorage.getItem("gemini_sys") || "";

      if (!prompt && !base64Image) return;
      if (!apiKey) {
        alert("Please set your Gemini API Key in Settings.");
        toggleSettings();
        return;
      }

      appendMessage("user", prompt || "[Image Prompt]");
      input.value = "";

      const parts = [];
      if (base64Image) {
        parts.push({ inline_data: { mime_type: base64Mime, data: base64Image } });
        clearImage();
      }
      if (prompt) {
        parts.push({ text: prompt });
      }

      const payload = {
        contents: [{ role: "user", parts: parts }],
        generationConfig: { temperature: temp }
      };

      if (systemInstruction.trim()) {
        payload.systemInstruction = { parts: [{ text: systemInstruction }] };
      }

      const botBubble = appendMessage("model", "Thinking...");

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "(No response)";
        botBubble.innerText = reply;
      } catch (err) {
        botBubble.innerText = "Error: " + err.message;
        botBubble.classList.add("text-red-400");
      }
    }
  </script>
</body>
</html>
